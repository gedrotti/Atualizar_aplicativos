name: PSScriptAnalyzer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar PSScriptAnalyzer
        shell: pwsh
        run: Install-PSResource -Name PSScriptAnalyzer -Scope CurrentUser -TrustRepository

      - name: Analisar
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }
          Write-Host 'Nenhum erro encontrado.'

      - name: Verificar sintaxe no Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'Atualizar-Aplicativos.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count) {
            $errors | Format-List
            exit 1
          }
          Write-Host 'Sintaxe OK.'
